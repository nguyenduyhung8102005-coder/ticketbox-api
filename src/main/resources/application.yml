# Cấu hình dùng chung cho mọi môi trường.
# Cấu hình riêng nằm ở application-{dev,test,prod}.yml.

spring:
  application:
    name: ticketbox-api
  profiles:
    default: dev

  # Xác thực bằng JWT tự viết (AuthService + JwtAuthenticationFilter), không dùng UserDetailsService:
  # tắt user mặc định mà Spring Security tự sinh kèm mật khẩu in ra log.
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

  jpa:
    open-in-view: false            # tránh lazy-load trong controller, giữ transaction ở tầng service
    hibernate:
      ddl-auto: validate           # schema do Flyway quản lý, Hibernate chỉ kiểm tra
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    web:
      pageable:
        max-page-size: 100       # chặn client xin ?size=1000000

  # Kafka: outbox → topic ticketbox.booking-events → consumer (notification, payment-refund)
  kafka:
    producer:
      acks: all                  # chỉ coi là gửi xong khi mọi replica đã ghi
      properties:
        enable.idempotence: true
        max.block.ms: 5000       # Kafka sập: send() lỗi sau 5s thay vì treo 60s (relay đang giữ transaction)
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
    consumer:
      auto-offset-reset: earliest
    listener:
      ack-mode: record           # commit offset sau từng tin nhắn: giảm số tin nhắn bị giao lại khi consumer chết

  mail:
    default-encoding: UTF-8
    properties:
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

  thymeleaf:
    # Thymeleaf chỉ dùng render email, không render trang web
    check-template-location: false

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC

  # Bật ở Giai đoạn 4 để đo khác biệt hiệu năng trước/sau.
  threads:
    virtual:
      enabled: false

server:
  port: 8081
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    description: Hệ thống đặt vé xem phim và sự kiện

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

app:
  cors:
    allowed-origins: http://localhost:3000,http://localhost:5173
  # Múi giờ nghiệp vụ: "suất chiếu ngày 20/10" được hiểu theo giờ Việt Nam, DB vẫn lưu UTC
  timezone: Asia/Ho_Chi_Minh
  jwt:
    issuer: ticketbox-api
    access-token-ttl: 15m
    refresh-token-ttl: 7d
    # secret khai báo theo từng profile; prod bắt buộc truyền qua JWT_SECRET
  booking:
    hold-ttl: 10m                # thời gian giữ ghế chờ thanh toán
    max-seats-per-booking: 8
    expiry-job:
      enabled: true
      interval: PT30S
      batch-size: 100
  # ----- Giai đoạn 3 -----
  messaging:
    booking-events-topic: ticketbox.booking-events
    topic-partitions: 3
    topic-replicas: 1
    outbox:
      relay-enabled: true
      relay-interval: PT1S
      batch-size: 100
      max-attempts: 10
      initial-backoff: PT2S
      max-backoff: PT10M
      retention: P7D
    consumer-retry:            # 1s, 2s, 4s, 8s rồi vào DLT ticketbox.booking-events.DLT
      max-retries: 4
      initial-interval: PT1S
      multiplier: 2.0
      max-interval: PT30S
  payment:
    max-attempts-per-booking: 5
    min-remaining-hold: PT1M
    vnpay:
      version: 2.1.0
      pay-url: https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
      api-url: https://sandbox.vnpayment.vn/merchant_webapi/api/transaction
      locale: vn
      order-type: other
      # tmn-code, hash-secret, return-url khai báo theo profile
    reconciliation:
      enabled: true
      interval: PT5M
      initiated-after: PT15M
      abandon-after: PT30M
      refund-retry-after: PT10M
      max-refund-attempts: 5
      batch-size: 50
  mail:
    from: no-reply@ticketbox.local
    from-name: Ticketbox
    timezone: ${app.timezone}
  # ticket.signing-secret khai báo theo profile

logging:
  pattern:
    level: "%5p [%X{requestId:-}]"
