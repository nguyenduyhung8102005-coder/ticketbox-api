# Môi trường production: mọi giá trị nhạy cảm BẮT BUỘC truyền qua biến môi trường, không có mặc định.

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      connection-timeout: 3000

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      timeout: 1s

  flyway:
    clean-disabled: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

management:
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  jwt:
    secret: ${JWT_SECRET}
  # Chỉ tạo admin khi truyền ADMIN_EMAIL/ADMIN_PASSWORD; nên bỏ biến sau lần chạy đầu
  bootstrap:
    admin:
      email: ${ADMIN_EMAIL:}
      password: ${ADMIN_PASSWORD:}
  ticket:
    signing-secret: ${TICKET_SIGNING_SECRET}
  messaging:
    topic-replicas: ${KAFKA_TOPIC_REPLICAS:3}
  mail:
    from: ${MAIL_FROM}
  payment:
    vnpay:
      tmn-code: ${VNPAY_TMN_CODE}
      hash-secret: ${VNPAY_HASH_SECRET}
      return-url: ${VNPAY_RETURN_URL}
      pay-url: ${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
      api-url: ${VNPAY_API_URL:https://sandbox.vnpayment.vn/merchant_webapi/api/transaction}
      server-ip: ${SERVER_PUBLIC_IP:127.0.0.1}

logging:
  level:
    root: INFO
    com.ticketbox: INFO
