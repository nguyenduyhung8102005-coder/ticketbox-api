# Môi trường phát triển local. Giá trị mặc định khớp với .env.example và docker-compose.yml.

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${POSTGRES_DB:ticketbox}
    username: ${POSTGRES_USER:ticketbox}
    password: ${POSTGRES_PASSWORD:ticketbox_dev}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:redis_dev}
      timeout: 2s

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

  # Mailpit (docker compose) nhận mọi email, xem tại http://localhost:8025 - không gửi ra ngoài
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}

management:
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.ticketbox: DEBUG
    org.hibernate.SQL: DEBUG                                    # in câu SQL
    org.hibernate.orm.jdbc.bind: TRACE                          # in giá trị tham số
    org.apache.kafka: WARN

server:
  port: 8081

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-khong-dung-cho-production-0123456789}
  # Tài khoản admin tạo sẵn khi khởi động để thử các API /api/v1/admin/**
  bootstrap:
    admin:
      email: ${ADMIN_EMAIL:admin@ticketbox.local}
      password: ${ADMIN_PASSWORD:Admin@123456}
  ticket:
    signing-secret: ${TICKET_SIGNING_SECRET:dev-only-ticket-secret-khong-dung-cho-production}
  payment:
    vnpay:
      # Đăng ký sandbox tại https://sandbox.vnpayment.vn/devreg/ để nhận 2 giá trị này qua email
      tmn-code: ${VNPAY_TMN_CODE:CHANGE_ME}
      hash-secret: ${VNPAY_HASH_SECRET:CHANGE_ME}
      return-url: ${VNPAY_RETURN_URL:http://localhost:8081/api/v1/payments/vnpay/return}
