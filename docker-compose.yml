# Hạ tầng phát triển local.
#   Chỉ chạy hạ tầng (mặc định):      docker compose up -d     (PostgreSQL, Redis, Kafka, Mailpit)
#   Chạy cả ứng dụng trong Docker:     docker compose --profile app up -d --build
# Biến môi trường đọc từ file .env (copy từ .env.example).

name: ticketbox

services:
  postgres:
    image: postgres:16-alpine
    container_name: ticketbox-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ticketbox}
      POSTGRES_USER: ${POSTGRES_USER:-ticketbox}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ticketbox_dev}
      TZ: UTC
      PGTZ: UTC
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"   # chỉ mở cho máy local, không mở ra mạng ngoài
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ticketbox-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-redis_dev}", "--appendonly", "yes"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_dev}
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Kafka 1 node chế độ KRaft (không cần ZooKeeper).
  # Hai listener: PLAINTEXT cho ứng dụng chạy trên máy (localhost:9092), DOCKER cho container app (kafka:29092).
  kafka:
    image: apache/kafka:3.9.1
    container_name: ticketbox-kafka
    ports:
      - "127.0.0.1:${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,DOCKER://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:${KAFKA_PORT:-9092},DOCKER://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,DOCKER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  # Mailpit: SMTP giả (thay MailHog, cùng cổng 1025/8025, vẫn được bảo trì). Mọi email dừng ở đây, không gửi ra ngoài.
  mailpit:
    image: axllent/mailpit:latest   # chỉ dùng khi dev
    container_name: ticketbox-mailpit
    ports:
      - "127.0.0.1:${MAIL_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    restart: unless-stopped

  app:
    profiles: ["app"]
    build: .
    container_name: ticketbox-app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: postgres
      DB_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-ticketbox}
      POSTGRES_USER: ${POSTGRES_USER:-ticketbox}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ticketbox_dev}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_dev}
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-khong-dung-cho-production-0123456789}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      TICKET_SIGNING_SECRET: ${TICKET_SIGNING_SECRET:-dev-only-ticket-secret-khong-dung-cho-production}
      VNPAY_TMN_CODE: ${VNPAY_TMN_CODE:-CHANGE_ME}
      VNPAY_HASH_SECRET: ${VNPAY_HASH_SECRET:-CHANGE_ME}
      VNPAY_RETURN_URL: ${VNPAY_RETURN_URL:-http://localhost:8081/api/v1/payments/vnpay/return}
    ports:
      - "8081:8081"

volumes:
  postgres-data:
  redis-data:
  kafka-data:
